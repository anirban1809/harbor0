<!doctype html>
<html class="dark">
<head>
<meta charset="utf-8">
<title>Devices Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --background:#141518;--foreground:#eceef1;--card:#1b1d21;--sidebar:#0d0e10;
  --primary:#8793ff;--primary-foreground:#0e1024;--border:#2b2e34;
  --success:#52c987;--warning:#e5a949;--kind-image:#3fd0c0;
  --text:#eceef1;--text-2:color-mix(in oklab,var(--text) 66%,var(--background));
  --text-3:color-mix(in oklab,var(--text) 48%,var(--background));
  --fill-1:color-mix(in oklab,var(--text) 4%,var(--background));
  --fill-2:color-mix(in oklab,var(--text) 7%,var(--background));
  --fill-3:color-mix(in oklab,var(--text) 11%,var(--background));
  --accent-soft:color-mix(in oklab,var(--primary) 14%,var(--background));
  --accent-text:color-mix(in oklab,var(--primary) 84%,var(--text));
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2c31;font-family:Geist,system-ui,sans-serif;color:var(--text);font-size:14px;padding:28px;height:100vh}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.win{display:flex;height:100%;background:var(--sidebar);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px -20px #000a;border:1px solid #33363c}
/* sidebar */
.side{width:248px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;flex:none}
.lights{display:flex;gap:8px;padding:2px 4px 18px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;padding:0 8px 16px}
.brand b{width:22px;height:22px;border-radius:50%;border:3px solid var(--primary);border-right-color:transparent;display:block}
.upl{background:var(--primary);color:var(--primary-foreground);border-radius:8px;height:36px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:14px}
.nav.on{background:var(--fill-2);color:var(--text)}
.nav .meta{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:16px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.sec svg{width:14px;height:14px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.ok{background:var(--success)}.dot.sync{background:var(--primary);box-shadow:0 0 0 3px color-mix(in oklab,var(--primary) 25%,transparent)}.dot.off{background:transparent;border:1.5px solid var(--text-3)}
.dev{height:auto;padding:7px 10px}
.dev .n{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.dev .n small{font-size:11.5px;color:var(--text-3)}
.dev .dot{margin-left:auto}
.more{font-size:12.5px;color:var(--text-3);padding:4px 10px 0 38px}
.spacer{flex:1}
.store{background:var(--fill-1);border-radius:10px;padding:12px;font-size:12.5px;color:var(--text-2)}
.store .bar{height:4px;background:var(--fill-3);border-radius:4px;margin:10px 0 8px;overflow:hidden}.store .bar i{display:block;height:100%;width:3%;background:var(--primary)}
.store .r{display:flex;justify-content:space-between;color:var(--text)}.store a{color:var(--accent-text)}
/* main */
.main{flex:1;background:var(--background);margin:8px 8px 8px 0;border-radius:12px;border:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px;flex:none}
.search{width:480px;height:36px;border-radius:8px;background:var(--fill-2);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text-3)}
.top .r{margin-left:auto;display:flex;gap:18px;align-items:center;color:var(--text-2)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-size:13px;font-weight:600}
.body{padding:24px 28px;overflow:hidden;flex:1;display:flex;flex-direction:column;min-height:0}
.crumb{font-size:12.5px;color:var(--text-3);margin-bottom:10px}
.head{display:flex;gap:16px;align-items:center}
.devicon{width:52px;height:52px;border-radius:12px;background:var(--fill-2);display:grid;place-items:center;color:var(--text-2)}
.devicon svg{width:26px;height:26px}
.head h1{font-size:24px;font-weight:600;display:flex;align-items:center;gap:10px}
.badge{font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:99px;background:var(--fill-2);color:var(--text-2)}
.badge.ok{background:color-mix(in oklab,var(--success) 15%,var(--background));color:var(--success)}
.badge.acc{background:var(--accent-soft);color:var(--accent-text)}
.head .sub{color:var(--text-2);font-size:13px;margin-top:4px;display:flex;gap:14px}
.head .sub span+span:before{content:"·";margin-right:14px;color:var(--text-3)}
.actions{margin-left:auto;display:flex;gap:8px}
.btn{height:34px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:13.5px;color:var(--text)}
.btn.pri{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
.btn.icon{width:34px;padding:0;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 20px}
.stat{border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat small{font-size:12px;color:var(--text-3)}.stat div{font-size:17px;font-weight:600;margin-top:4px}
.stat em{font-style:normal;font-size:12px;color:var(--text-2);font-weight:400;margin-left:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:9px 12px;color:var(--text-2);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab.on{color:var(--text);border-color:var(--primary)}
.tab .c{font-size:11.5px;color:var(--text-3);background:var(--fill-2);border-radius:99px;padding:1px 7px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--text-2)}
.sel{height:32px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--text)}
.sel svg{width:14px;height:14px;color:var(--text-3)}
table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:12.5px;color:var(--text-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px}
td.m{color:var(--text-2)}
.nm{display:flex;align-items:center;gap:12px}
.fi{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--primary);display:grid;place-items:center}
.nm small{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 8px 3px 6px;border-radius:99px;background:var(--fill-2);color:var(--text-2)}
.chip svg{width:13px;height:13px}
.chip.me{background:var(--accent-soft);color:var(--accent-text)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--fill-1);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text-2);margin-top:16px}
.note svg{color:var(--primary);margin-top:1px}
.ok-t{color:var(--success)}.warn-t{color:var(--warning)}
.bar2{width:120px;height:4px;border-radius:4px;background:var(--fill-3);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}.bar2 i{display:block;height:100%;background:var(--primary)}
/* photos */
.pwrap{display:flex;gap:16px;flex:1;min-height:0}
.pscroll{flex:1;overflow:hidden}
.day{display:flex;align-items:baseline;gap:10px;margin:4px 0 8px;font-weight:600;font-size:14px}
.day small{font-weight:400;color:var(--text-3);font-size:12.5px}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px}.grid:after{content:"";flex:20 1 0}
.ph{height:132px;border-radius:4px;position:relative;overflow:hidden}
.ph .vb{position:absolute;right:6px;bottom:6px;font-size:11px;font-family:'Geist Mono';background:#0008;color:#fff;padding:1px 5px;border-radius:4px;display:flex;align-items:center;gap:3px}
.ph .vb svg{width:10px;height:10px;fill:#fff;stroke:none}
.ph.sel{outline:3px solid var(--primary);outline-offset:-3px}
.ph .ck{position:absolute;left:7px;top:7px;width:20px;height:20px;border-radius:50%;border:2px solid #fffc;background:#0003}
.ph.sel .ck{background:var(--primary);border-color:var(--primary);display:grid;place-items:center}
.ph.sel .ck:after{content:"";width:8px;height:4px;border-left:2px solid #0e1024;border-bottom:2px solid #0e1024;transform:rotate(-45deg) translate(1px,-1px)}
.scrub{width:44px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--text-3);text-align:right;padding:4px 0;position:relative;border-left:1px solid var(--border)}
.scrub span{padding-right:2px}.scrub b{color:var(--text);font-weight:600}
.selbar .btn,.selbar span{white-space:nowrap}.selbar{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 36px -8px #000c;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;font-size:13.5px}
.selbar .btn{border:none}
.fchip{height:30px;border-radius:99px;padding:0 12px;display:flex;align-items:center;gap:6px;background:var(--fill-2);color:var(--text-2);font-size:13px}
.fchip.on{background:var(--text);color:var(--background)}
.seg{display:flex;background:var(--fill-2);border-radius:8px;padding:3px;margin-left:auto}
.seg span{padding:4px 10px;border-radius:6px;font-size:12.5px;color:var(--text-2)}.seg span.on{background:var(--background);color:var(--text)}
.inactive .nav{opacity:.55}
</style>
</head>
<body>
<div class="win"><aside class="side" id="side"></aside><main class="main"><div class="top">
  <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span id="sph">Search your files</span></div>
  <div class="r"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><div class="av">A</div></div>

<script>
const I={

const ic=(n,s='')=>`<svg class="i" ${s} viewBox="0 0 24 24">${I[n]}</svg>`;
const screen=(location.hash||'#backups').slice(1);
const active=screen==='photos'?'iphone':screen==='pixel'?'pixel':'mac';

document.getElementById('side').innerHTML=`
<div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
<div class="brand"><b></b>harbor0</div>
<div class="upl">${ic('plus')}Upload files</div>

<div class="inactive"><div class="nav" style="font-size:13px">${ic('archive')}Inactive devices<span class="meta">2</span></div></div>
<div class="sec" style="padding-top:12px"></div>
<div class="nav">${ic('sync')}Sync folders</div>

<div class="spacer"></div>
<div class="store"><div class="r"><span>Storage</span><a>Manage</a></div><div class="bar"><i></i></div>264.3 MB of 100.0 GB</div>`;

const macHead=(tab)=>`
<div class="crumb">Devices / MacBook Pro</div>
<div class="head"><div class="devicon">${ic('laptop')}</div><div>
 <h1>MacBook Pro <span class="badge acc">This device</span></h1>

const B=document.getElementById('body');
if(screen==='backups'){
 B.innerHTML=macHead('b')+`

 <tr><td><div class="nm"><div class="fi">${ic('folder')}</div><div>Desktop<small>388 files · 22 versions</small></div></div></td><td class="m" style="font-family:'Geist Mono';font-size:12.5px">~/Desktop</td><td>41.9 MB</td><td><span style="color:var(--accent-text)"><span class="bar2"><i style="width:64%"></i></span>Uploading 64%</span></td><td class="m">Running now</td><td class="m">${ic('dots')}</td></tr>
 <tr><td><div class="nm"><div class="fi">${ic('folder')}</div><div>Projects<small>2,284 files · 14 versions</small></div></div></td><td class="m" style="font-family:'Geist Mono';font-size:12.5px">~/Code/projects</td><td>44.3 MB</td><td><span class="warn-t">● 12 files skipped</span></td><td class="m">Today, 09:40</td><td class="m">${ic('dots')}</td></tr>

}
if(screen==='sync'){
 const c=(n,me)=>`<span class="chip ${me?'me':''}">${ic(n.includes('Mac')?'laptop':'phone')}${n}</span>`;
