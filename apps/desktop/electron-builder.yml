appId: com.harbor.storage
productName: harbor0
artifactName: harbor0-${version}-${os}-${arch}.${ext}
icon: assets/icon.png
directories:
  output: release
files:
  - dist/**/*
  - package.json
  # esbuild bundles everything the app needs into dist. Without this, electron-builder packs the
  # workspace root's dependencies (Next, AWS CDK, the AWS SDK…), which adds ~480 MB.
  - '!node_modules{,/**/*}'
mac:
  target: [dmg]
  category: public.app-category.productivity
  # Without an Apple Developer ID the app is ad-hoc signed: an unsigned or partly signed bundle is
  # reported as "damaged" once downloaded, while an ad-hoc one can be opened with Open Anyway.
  # The hardened runtime only matters for notarization, and with ad-hoc signing it would block
  # Electron's frameworks from loading; turn it back on with a real identity.
  identity: '-'
  hardenedRuntime: false
win:
  target: [nsis]
linux:
  target: [AppImage, deb, rpm]
  category: Utility
  # deb and rpm require a maintainer; package.json has no author to take it from.
  maintainer: harbor0 <contact@harbor0.com>
  vendor: harbor0
  synopsis: Private storage, backup, sync, and sending
  executableName: harbor0
  # Names the window after harbor0.desktop, so docks group it with the launcher.
  syncDesktopName: true
# electron-builder's default package dependencies plus ALSA and GBM, which Electron also loads at
# start; desktops have them, minimal installs don’t. Ubuntu 24.04 renamed libasound2 to libasound2t64,
# which goes first: apt would otherwise take a libasound2 stub (liboss4-salsa-asound2) for it.
deb:
  depends:
    [
      libgtk-3-0,
      libnotify4,
      libnss3,
      libxss1,
      libxtst6,
      xdg-utils,
      libatspi2.0-0,
      libuuid1,
      libsecret-1-0,
      libasound2t64 | libasound2,
      libgbm1,
    ]
rpm:
  depends:
    [
      gtk3,
      libnotify,
      nss,
      libXScrnSaver,
      (libXtst or libXtst6),
      xdg-utils,
      at-spi2-core,
      (libuuid or libuuid1),
      alsa-lib,
      mesa-libgbm,
    ]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
