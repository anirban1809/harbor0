name: Deploy production
# Automatic: every push to main deploys once the full Validate workflow (checks, integration, e2e,
# sync) has passed for that commit. A manual run from main redeploys its latest commit.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
# Deploys run in push order and never overlap; a newer commit waits for the one in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    # The AWS role only trusts main. Validate also runs for pull requests; only pushes deploy.
    # Until PRODUCTION_AWS_ROLE_ARN is set the job is skipped rather than failing.
    if: >-
      vars.PRODUCTION_AWS_ROLE_ARN != '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit Validate passed, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PRODUCTION_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PRODUCTION_AWS_REGION || 'us-east-1' }}
      - name: Write .env.cloud
        env:
          AWS_REGION: ${{ vars.PRODUCTION_AWS_REGION || 'us-east-1' }}
          R2_BUCKET: ${{ vars.PRODUCTION_R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.PRODUCTION_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN }}
          WEB_CERT_ARN: ${{ vars.PRODUCTION_WEB_CERT_ARN }}
          LANDING_CERT_ARN: ${{ vars.PRODUCTION_LANDING_CERT_ARN }}
          EMAIL_FROM: ${{ vars.PRODUCTION_EMAIL_FROM }}
          ADMIN_ORIGIN: ${{ vars.PRODUCTION_ADMIN_ORIGIN }}
          ADMIN_DOMAIN: ${{ vars.PRODUCTION_ADMIN_DOMAIN }}
          ADMIN_CERT_ARN: ${{ vars.PRODUCTION_ADMIN_CERT_ARN }}
        run: |
          umask 077
          for name in AWS_REGION R2_BUCKET R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
            CLOUDFLARE_API_TOKEN WEB_ORIGIN WEB_CERT_ARN LANDING_CERT_ARN EMAIL_FROM \
            ADMIN_ORIGIN ADMIN_DOMAIN ADMIN_CERT_ARN; do
            printf '%s=%s\n' "$name" "${!name}"
          done > .env.cloud
      # Backend first (writes the outputs the other deploys read), then the sites.
      - run: npm run cloud:deploy
      - run: npm run cloud:deploy-web
      - run: npm run cloud:deploy-admin
      - run: npm run cloud:deploy-landing
