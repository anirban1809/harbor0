services:
  dynamodb:
    image: amazon/dynamodb-local:3.0.0
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data'
    user: root
    ports: ['127.0.0.1:8100:8000']
    volumes: ['dynamo-data:/home/dynamodblocal/data']
  storage:
    # MinIO stopped publishing images (quay.io/minio and Docker Hub minio/minio are gone); this is
    # the community pgsty build of the same server, pinned by digest.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: local-storage
      MINIO_ROOT_PASSWORD: local-development-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    ports: ['127.0.0.1:9100:9000', '127.0.0.1:9101:9001']
    volumes: ['object-data:/data']
volumes:
  dynamo-data:
  object-data:
